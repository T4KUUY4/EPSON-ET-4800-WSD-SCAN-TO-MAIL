<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="880" height="300" rx="12" fill="#f6f7f9"/>

  <!-- printer -->
  <rect x="24" y="70" width="190" height="150" rx="10" fill="#fff" stroke="#d5d9e0"/>
  <text x="119" y="98" text-anchor="middle" font-weight="600" fill="#1d2330">Printer</text>
  <text x="119" y="120" text-anchor="middle" fill="#667085" font-size="12">Scan → Computer (WSD)</text>
  <rect x="44" y="134" width="150" height="24" rx="5" fill="#e8effc" stroke="#2f6fde"/>
  <text x="119" y="151" text-anchor="middle" fill="#1d2330" font-size="12">OFFICE</text>
  <rect x="44" y="164" width="150" height="24" rx="5" fill="#fff" stroke="#d5d9e0"/>
  <text x="119" y="181" text-anchor="middle" fill="#1d2330" font-size="12">INVOICES</text>

  <!-- service -->
  <rect x="330" y="50" width="220" height="190" rx="10" fill="#fff" stroke="#2f6fde" stroke-width="1.5"/>
  <text x="440" y="78" text-anchor="middle" font-weight="600" fill="#1d2330">wsd-scan container</text>
  <text x="440" y="108" text-anchor="middle" fill="#667085" font-size="12">registers one WSD "computer"</text>
  <text x="440" y="126" text-anchor="middle" fill="#667085" font-size="12">per destination</text>
  <text x="440" y="156" text-anchor="middle" fill="#667085" font-size="12">fetches the pages,</text>
  <text x="440" y="174" text-anchor="middle" fill="#667085" font-size="12">builds a PDF</text>
  <rect x="380" y="194" width="120" height="28" rx="6" fill="#e8effc"/>
  <text x="440" y="213" text-anchor="middle" fill="#2f6fde" font-size="12">web UI :8098</text>

  <!-- mail -->
  <rect x="666" y="70" width="190" height="150" rx="10" fill="#fff" stroke="#d5d9e0"/>
  <text x="761" y="98" text-anchor="middle" font-weight="600" fill="#1d2330">Your SMTP server</text>
  <text x="761" y="140" text-anchor="middle" fill="#667085" font-size="12">office@example.com</text>
  <text x="761" y="162" text-anchor="middle" fill="#667085" font-size="12">receives scan.pdf</text>

  <!-- arrows -->
  <line x1="218" y1="110" x2="324" y2="110" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="271" y="100" text-anchor="middle" fill="#5b6472" font-size="11">1 button event</text>
  <line x1="326" y1="160" x2="220" y2="160" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="273" y="150" text-anchor="middle" fill="#5b6472" font-size="11">2 scan job</text>
  <line x1="218" y1="190" x2="324" y2="190" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="271" y="208" text-anchor="middle" fill="#5b6472" font-size="11">3 pages</text>
  <line x1="554" y1="145" x2="660" y2="145" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="607" y="135" text-anchor="middle" fill="#5b6472" font-size="11">4 email + PDF</text>

  <text x="440" y="278" text-anchor="middle" fill="#667085" font-size="12">WS-Discovery · WS-Eventing · WS-Scan (the protocol Windows uses for "Scan to Computer (WSD)")</text>
</svg>
